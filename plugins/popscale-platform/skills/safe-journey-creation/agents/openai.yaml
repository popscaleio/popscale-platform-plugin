interface:
  display_name: "Safe Journey Creation"
  short_description: "Create and publish Popscale journeys safely"
  default_prompt: "Use $safe-journey-creation to create a validated Popscale learning journey from approved company knowledge."
dependencies:
  tools:
    - type: "mcp"
      value: "popscale-platform"
      description: "Company-scoped Popscale tools and Journey Review MCP App"

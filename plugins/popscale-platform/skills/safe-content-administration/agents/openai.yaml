interface:
  display_name: "Popscale Content Administration"
  short_description: "Safely edit and generate company content"
  default_prompt: "Use $safe-content-administration to find and make one precise, reviewable change to my company's Popscale content."
dependencies:
  tools:
    - type: "mcp"
      value: "popscale-platform"
      description: "Authenticated, company-scoped Popscale product tools"
      transport: "streamable_http"
      url: "https://app.popscale.io/mcp/"
policy:
  allow_implicit_invocation: true

name: Publish plugin release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate release contract
        run: |
          python3 scripts/validate_release.py --tag "$GITHUB_REF_NAME"
          python3 -m unittest discover -s plugins/popscale-platform/tests -p 'test_*.py' -v
          python3 scripts/live_docs_smoke.py

      - name: Build Claude and local-install archive
        run: |
          mkdir -p dist
          cd plugins/popscale-platform
          zip -r "../../dist/popscale-platform-${GITHUB_REF_NAME}.zip" . \
            -x 'tests/*' '__pycache__/*' '*.pyc'

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/popscale-platform-${GITHUB_REF_NAME}.zip" \
            --verify-tag \
            --generate-notes \
            --title "Popscale Platform ${GITHUB_REF_NAME}"

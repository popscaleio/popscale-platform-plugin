name: Validate plugin package

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate release contract
        run: python3 scripts/validate_release.py

      - name: Run package contract tests
        run: python3 -m unittest discover -s plugins/popscale-platform/tests -p 'test_*.py' -v

      - name: Check JSON syntax
        run: |
          python3 -m json.tool .agents/plugins/marketplace.json >/dev/null
          python3 -m json.tool .claude-plugin/marketplace.json >/dev/null
          python3 -m json.tool plugins/popscale-platform/.codex-plugin/plugin.json >/dev/null
          python3 -m json.tool plugins/popscale-platform/.claude-plugin/plugin.json >/dev/null
          python3 -m json.tool plugins/popscale-platform/.mcp.json >/dev/null

      - name: Check whitespace
        run: git diff --check
